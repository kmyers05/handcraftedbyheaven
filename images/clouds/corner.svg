<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
@keyframes d1{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
@keyframes d2{from{transform:translateX(12px)}to{transform:translateX(-12px)}}
@keyframes d3{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
